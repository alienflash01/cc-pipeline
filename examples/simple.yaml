# 最小示例：单 module 单步 pipeline

repo: /mnt/e/02.workspace/co-demo
base_branch: master
concurrency: 1

pipeline:
  - id: generate
    executor: claude-code
    prompt: |
      你在为 {module} 模块生成单元测试。
      源码目录：{source_dir}
      读取所有 .py 文件，为每个函数生成 pytest 测试。
      使用 /usr/bin/python3 运行测试。
      不要创建虚拟环境，不要 pip install。
    postcondition:
      shell: "/usr/bin/python3 -m pytest tests/ -v 2>&1 | tail -1"
      expect: "contains('passed')"

modules:
  - name: math
    source_dir: src/
    source_files:
      - math_utils.py
