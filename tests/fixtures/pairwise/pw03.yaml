repo: /tmp/cc-pipeline-blackbox/fake-repo
base_branch: main
concurrency: 1
max_retries: 0
prompt_prefix: "GLOBAL"
snippets:
    hi: "echo hi"
pipeline:
  - id: rescue
    executor: shell
    prompt: "echo rescue > /dev/null"
  - id: main
    executor: shell
    prompt_file: /tmp/pw-test/prompts/valid.md
    loop: per_file
    on_failure: rescue
    on_failure_max_jumps: 1
    timeout: 2
    postcondition:
      shell: "echo '{\"score\": 85}'"
      expect: "$.score >= 80"
modules:
  - name: m1
    source_dir: src
    source_files: [{path: a.c, assert_macro: CHECK}, {path: b.c, assert_macro: REQUIRE}]
    file_order: batched