repo: /tmp/cc-pipeline-blackbox/fake-repo
base_branch: main
concurrency: 1
max_retries: 0
snippets:
    hi: "echo hi"
pipeline:
  - id: rescue
    executor: shell
    prompt: "echo rescue > /dev/null"
  - id: main
    executor: shell
    prompt_file: /tmp/pw-test/prompts/nonexist.md
    loop: per_file
    on_failure: rescue
    on_failure_max_jumps: 1
    depends_on: rescue
    timeout: 2
    postcondition:
      shell: "echo PASS_OK"
      expect: contains('PASS')
modules:
  - name: m1
    source_dir: src
    source_files: [{path: a.c, assert_macro: CHECK}, {path: b.c, assert_macro: REQUIRE}]
    file_order: batched
    continue_on_error: true