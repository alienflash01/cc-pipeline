repo: /tmp/pytest-of-fanwei/pytest-91/test_pairwise_case_pw09_0/repo
base_branch: main
concurrency: 1
max_retries: 1
prompt_prefix: "GLOBAL"
pipeline:
  - id: main
    executor: shell
    prompt: "echo ok > /tmp/pw-test/results/pw09.txt"
    loop: per_file
    retry: 1
    timeout: 2
    postcondition:
      shell: "echo PASS_OK"
      expect: contains('PASS')
    output: pw09_out.json
modules:
  - name: m1
    source_dir: src
    source_files: [{path: a.c, assert_macro: CHECK}, {path: b.c, assert_macro: REQUIRE}]
    file_order: sequential
    continue_on_error: true